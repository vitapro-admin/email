name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=podpora:podpora@aquapro.test,ivana:ivana@aquapro.test,integracia:integracia@aquapro.test
        ports:
          - 3025:3025
          - 3143:3143
    env:
      MAIL_TEST_IMAP_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for test mailserver
        run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null; do sleep 1; done'
      - run: pnpm check
