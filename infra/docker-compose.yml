# Testovací mailserver pre vývoj (GreenMail). Obsahuje len syntetické dáta, nič nejde von.
# Spustenie:  docker compose -f infra/docker-compose.yml up -d
# Zastavenie: docker compose -f infra/docker-compose.yml down
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=podpora:podpora@aquapro.test,ivana:ivana@aquapro.test,integracia:integracia@aquapro.test,prijemca:prijemca@aquapro.test
    ports:
      # Len z tohto počítača (127.0.0.1), nie z celej siete.
      - "127.0.0.1:3025:3025" # SMTP
      - "127.0.0.1:3143:3143" # IMAP
